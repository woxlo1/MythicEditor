# MythicEditor relay worker.
# Deploy once with:  npx wrangler deploy
# (the Durable Object class below can only be created by "wrangler deploy", not by pasting code in the dashboard;
#  after that first deploy, later code changes may be pasted into the dashboard editor again.)
name = "mythiceditor"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]
